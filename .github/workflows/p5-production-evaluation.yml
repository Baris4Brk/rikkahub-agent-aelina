name: P5 production-component evaluation

on:
  pull_request:
    paths:
      - "app/src/main/java/me/rerere/rikkahub/learning/**"
      - "app/src/main/java/me/rerere/rikkahub/data/ai/RecallPromptCompiler.kt"
      - "app/src/test/java/me/rerere/rikkahub/learning/eval/**"
      - "docs/agent-learning/baselines/**"
      - "app/build.gradle.kts"
      - ".github/workflows/p5-production-evaluation.yml"
  workflow_dispatch:

jobs:
  frozen-production-eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Every value below is part of ProductionEvalRuntimeEnvironment's reviewed digest.
      # The test also observes os.name/os.arch and the actual JVM vendor/major/VM family.
      RIKKAHUB_P5_CI_PROFILE: gha-ubuntu-24.04-x64-temurin17-v1
      RIKKAHUB_P5_GRADLE_VERSION: "9.4.1"
      RIKKAHUB_P5_AGP_VERSION: "9.2.1"
      RIKKAHUB_P5_KOTLIN_VERSION: "2.4.0"
      RIKKAHUB_P5_JVM_TARGET: "17"
      RIKKAHUB_P5_COMPILE_SDK: "37"
      RIKKAHUB_P5_GATE_TASK: app-p5-production-evaluation-gate
      RIKKAHUB_P5_REQUIRE_FROZEN_ENVIRONMENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run frozen P5 production-component gate
        run: ./gradlew :app:p5ProductionEvaluationGate --no-parallel
      - name: Publish redacted aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-production-eval-redacted
          path: app/build/reports/agent-learning/p5-production-eval-redacted.txt
          if-no-files-found: error
          retention-days: 14
