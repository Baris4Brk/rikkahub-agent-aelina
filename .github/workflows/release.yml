name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # pnpm, web/build.gradle.kts tarafından web-ui bağımlılıklarını
      # pnpm-lock.yaml'a göre kurmak ve web arayüzünü derlemek için kullanılır.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # Vite 7 ve React Router build zinciri için güncel Node.js kullanılır.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web-ui/pnpm-lock.yaml'

      - name: Verify build toolchain
        run: |
          java -version
          node --version
          pnpm --version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # Şifreli release keystore'u GitHub Secret'tan oluştur.
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # İmzalama yapılandırmasını local.properties içine yaz.
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # Google Services yapılandırmasını oluştur.
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk
